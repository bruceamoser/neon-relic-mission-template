- _id: example-information-web
  name: 'EXAMPLE-65-001 — Information Web'
  type: informationWeb
  system:
    # List every informationCard slug that belongs to this case. The web view
    # draws the found-at / known-by / npc links compiled into each card.
    informationCardSlugs: [example-ic01, example-ic02, example-ic03]
